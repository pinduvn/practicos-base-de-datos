services:
  postgres:
    image: postgres:18-alpine
    container_name: fabrica-db
    environment:
      POSTGRES_USER: fabrica
      POSTGRES_PASSWORD: fabrica123
      POSTGRES_DB: fabrica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrica -d fabrica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
